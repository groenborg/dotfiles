# Fix colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Turn on mouse
set -g mouse on

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Terminal features
# Fix Shift+Enter for newlines in claude code
set -g extended-keys always
set -g extended-keys-format csi-u 
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features ",*:hyperlinks"

# set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split should open in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Custom bindings
#bind -n M-H previous-window
#bind -n M-L next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'rose-pine/tmux'


# Rose Pine theme config
set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'off'
set -g @rose_pine_date_time ''
set -g @rose_pine_user 'off'
set -g @rose_pine_directory 'off'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
# Show session name (now it's meaningful!)
set -g @rose_pine_prioritize_windows 'off'
set -g @rose_pine_show_current_program 'off'
set -g @rose_pine_show_pane_directory 'off'
set -g @rose_pine_disable_active_window_menu 'on'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'